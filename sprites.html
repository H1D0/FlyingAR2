<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>앵알이 날리기 · 도트 스프라이트</title><style>body{margin:0;background:#e8f2e6;color:#29413e;font:15px Arial,'Malgun Gothic',sans-serif;padding:25px}h1{font-size:28px}a{color:#ad394e}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}article{background:#fffcf0;padding:20px;border-radius:16px;text-align:center}canvas{display:block;margin:auto;max-width:100%;height:auto;image-rendering:pixelated;background:repeating-conic-gradient(#ebedde 0% 25%,#fafff1 0% 50%) 0/16px 16px}select{font:inherit;padding:9px;width:100%;margin-top:12px}small{display:block;margin:10px;color:#607365}</style><h1>앵알이 날리기 · 스프라이트 도감</h1><p>확정 디자인 · 원본 참고 이미지를 게임에 삽입하지 않고 새로 제작한 192프레임</p><p><a href="./">게임으로 돌아가기 ↗</a></p><div id="grid"></div><script type="module">
import {Assets} from './src/assets.js';import {C} from './src/config.js';const assets=new Assets();await assets.load();const rows=[];for(const key of ['uaeng','bird','maid','koko','inori','ppung','cat']){const m=assets.manifest.sheets[key],card=document.createElement('article');card.innerHTML='<h2>'+C.characters[key].name+'</h2>';const canvas=document.createElement('canvas');canvas.width=Math.max(192,m.width*2);canvas.height=224;const select=document.createElement('select');for(const name of Object.keys(m.animations)){const o=document.createElement('option');o.textContent=name;select.append(o);}card.append(canvas,select);const info=document.createElement('small');info.textContent=m.width+'×'+m.height+'px · '+Object.values(m.animations).reduce((n,a)=>n+a.frames.length,0)+' 프레임 · PNG 투명';card.append(info);document.querySelector('#grid').append(card);rows.push({key,canvas,select,time:0});select.onchange=()=>rows.find(r=>r.key===key).time=0;}let last=0;function draw(now){let dt=Math.min(.05,(now-last)/1000);last=now;for(const r of rows){r.time+=dt;const ctx=r.canvas.getContext('2d');ctx.clearRect(0,0,r.canvas.width,224);ctx.imageSmoothingEnabled=false;assets.draw(ctx,r.key,r.select.value,r.time%1.3,assets.manifest.sheets[r.key].anchor[0]*2,210,r.key==='bird'?3:2);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
